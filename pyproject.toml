[tool.ruff]
line-length = 100
target-version = "py311"  # Tier A CI runs Python 3.11 (docs/standards/pipeline-testing.md §1.4)

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]

[tool.pylint.main]
py-version = "3.11"
# The blocking E-class gate (--disable=all --enable=E --disable=E0401,E1101)
# lives on the hook/CI command line, not here — see aw-app-template.

[tool.coverage.run]
source = ["mobile_app"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "if __name__ == .__main__",
    "raise NotImplementedError",
    "pass",
    "except ImportError",
]
show_missing = true
precision = 1
# One-way ratchet per §4.2: measured baseline 2026-11-06 was 84.16%,
# floored to 84 (the §10 Handoffs table's "83%" is the stale 2026-09-09
# snapshot). May only rise.
fail_under = 84
